	<script type="text/javascript">
		$(function() {
			$("#updatecategory").click(function(){
				if($("#category_nombre").val() != "" && $("#friendly_url").val() != ""){
					if($('#estado')[0].checked == true){
						var publicado = 1;
					} else {
						var publicado = 0;
					}
					
					$.ajax({
					  method: "POST",
					  url: "<?=updateblogcategory?>",
					  data: { categoria_id: $("#categoria_id").val(), categoria_nombre: $("#categoria_nombre").val(), friendly_url: $("#friendly_url").val(), categoria_description: $("#categoria_description").val(), keywords: $("#tags_1").val(), estado: publicado }
					}).done(function( msg ) {
						if(msg !== ""){
							alert(msg);
						}else{
							window.location = '<?=blogcategoryeditfile?>?category='+$("#categoria_id").val()+'&updated=1';
						}
					});
				} else {
					alert("Debes rellenar los campos obligatorios.");
				}
			});
		});	
		

		Dropzone.autoDiscover = false;
		$('.dropzone').dropzone ({
				url: "<?=uploadimagesblogcategoryfile?>",
				init: function() {
					thisDropzone = this;
					$.ajax({
					  method: "POST",
					  url: "<?=uploadimagesblogcategoryfile?>",
					  data: { categoryID: $("#categoria_id").val() },
					  dataType: "json"
					}).done(function(data) {
						
						$.each(data, function(key,value){
							 
							var mockFile = { name: "../uploads/blogcategories/"+value.file_name, size: value.id };
							
							thisDropzone.emit("addedfile", mockFile);
							
							thisDropzone.createThumbnailFromUrl(mockFile, "../uploads/blogcategories/"+value.file_name);

							thisDropzone.emit("complete", mockFile);
	 	
						});
						
					});
					
					this.on("sending", function(file, xhr, formData){
						formData.append("categoryID", $("#categoria_id").val())
					});
					
					this.on('removedfile', function(file){
						$.ajax({
						url: "<?=deleteimagesblogcategoryfile?>",
						type: "POST",
						data: { 'imageID': file.size, 'ruta': file.name}
						});
					});
				},
		});
	</script>
