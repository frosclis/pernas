	<script type="text/javascript">
		$(function() {
			$("#updateslider").click(function(){
				if($("#titulo").val() != ""){
					if($('#estado')[0].checked == true){
						var publicado = 1;
					} else {
						var publicado = 0;
					}
					
					$.ajax({
					  method: "POST",
					  url: "<?=updateslider?>",
					  data: { slider_id: $("#slider_id").val(), titulo: $("#titulo").val(), subtitulo: $("#subtitulo").val(), estado: publicado, contenido: $("#contenido").val() }
					}).done(function( msg ) {
						if(msg !== ""){
							alert(msg);
						}else{
							window.location = '<?=slidereditfile?>?slider='+$("#slider_id").val()+'&updated=1';
						}
					});
				} else {
					alert("Debes rellenar los campos obligatorios.");
				}
			});
		});	
		

		Dropzone.autoDiscover = false;
		$('.dropzone').dropzone ({
				url: "<?=uploadimagessliderfile?>",
				init: function() {
					thisDropzone = this;
					$.ajax({
					  method: "POST",
					  url: "<?=uploadimagessliderfile?>",
					  data: { sliderID: $("#slider_id").val() },
					  dataType: "json"
					}).done(function(data) {
						
						$.each(data, function(key,value){
							 
							var mockFile = { name: "../uploads/sliders/"+value.file_name, size: value.id };
							
							thisDropzone.emit("addedfile", mockFile);
							
							thisDropzone.createThumbnailFromUrl(mockFile, "../uploads/sliders/"+value.file_name);

							thisDropzone.emit("complete", mockFile);
	 	
						});
						
					});
					
					this.on("sending", function(file, xhr, formData){
						formData.append("sliderID", $("#slider_id").val())
					});
					
					this.on('removedfile', function(file){
						$.ajax({
						url: "<?=deleteimagessliderfile?>",
						type: "POST",
						data: { 'sliderID': file.size, 'ruta': file.name}
						});
					});
				},
		});
	</script>
  </body>
