	<link href="css/nestable.css" type="text/css" rel="stylesheet" />
	<!-- jQuery -->
    <script src="vendors/jquery/dist/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="vendors/bootstrap/dist/js/bootstrap.min.js"></script>

    <!-- Custom Theme Scripts -->
    <script src="build/js/custom.min.js"></script>
	<script src="js/jquery.nestable.js"></script>
	<script type="text/javascript">			
			
		$(document).ready(function()
		{
		
		var updateOutput = function(e)
			{
				var list   = e.length ? e : $(e.target);
					output = list.data('output');
									
					$.ajax({
						method: "POST",
						url: "<?=updatemenufile?>",
						data: {
							menus: list.nestable('serialize')
						}
					}).fail(function(jqXHR, textStatus, errorThrown){
						alert("Unable to save new list order: " + errorThrown);
					});
				
			};

			$('#nestable-menu').on('click', function(e)
			{
				var target = $(e.target),
					action = target.data('action');
				if (action === 'expand-all') {
					$('.dd').nestable('expandAll');
				}
				if (action === 'collapse-all') {
					$('.dd').nestable('collapseAll');
				}
			});
			
			
			$('#nestable3').nestable({
				group: 1
			})
			.on('change', updateOutput);

			$(".options .remove").click(function(){
				$.ajax({
					url: "<?=delmenulinkfile?>",
					type: "POST",
					data: { 'menuID': this.getAttribute("data-id")}
				}).done(function(){
					location.reload();
				});
			});

			$(".options .add").click(function(){
				var url = this.getAttribute("data-url");
				var title = this.getAttribute("data-title");
				var type = this.getAttribute("data-type");

				var enlace = '';
				if(type==0){
					enlace = "/contenido/" + url;
				}
				
				if(type==1){
					enlace =  "/categoria-galerias/" + url;
				}
				
				if(type==2){
					enlace = "/galeria/"  + url;
				}

				$.ajax({
					method: "POST",
					url: "<?=addmenulinkfile?>",
					data: {
						'nombre': title,
						'ruta': enlace
					}
				}).done(function(data){
					window.location.reload();
				}).fail(function(jqXHR, textStatus, errorThrown){
					alert("Unable to save new list order: " + errorThrown);
				});
				
			});

			$(".options .custom_add").click(function(){
				var custom_url = document.getElementById("customURL").value;
				var custom_title = document.getElementById("customTITLE").value;

				$.ajax({
					method: "POST",
					url: "<?=addmenulinkfile?>",
					data: {
						'nombre': custom_title,
						'ruta': custom_url
					}
				}).done(function(data){
					window.location.reload();
				}).fail(function(jqXHR, textStatus, errorThrown){
					alert("Unable to save new list order: " + errorThrown);
				});
			});

		});
	</script>
	
  </body>
</html>
