	<script type="text/javascript">
	
	function borradoCategoria(id){
		var id = id;
		$.ajax({
		  method: "POST",
		  url: "<?=delcategoryfile?>",
		  data: { category_id: id }
		}).done(function( msg ) {
			if(msg !== ""){
				alert(msg);
			}else{
				window.location = "/catmin/categories.php";
			}
		});
	}
	
	$(function() {
		$("#nuevaCategoria").click(function(){
			if($("#categoria_nombre").val() != ""){				
				$.ajax({
				  method: "POST",
				  url: "<?=newcategoryfile?>",
				  data: { categoria_nombre: $("#categoria_nombre").val() }
				}).done(function( msg ) {
					if($.isNumeric(msg)){
						window.location = "<?=categoryeditfile?>?category=" + msg;
					}else{
						alert(msg);
					}
				});
			} else {
				alert("El campo de título no debería estar vacío.");
			}
		});
	});
	
</script>
