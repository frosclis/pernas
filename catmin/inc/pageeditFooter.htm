	<script type="text/javascript">	
		
		$(function() {
			$("#updatepage").click(function(){
				if($("#titulo").val() != "" && $("#friendly_url").val() != ""){
					if($('#estado')[0].checked == true){
						var publicado = 1;
					} else {
						var publicado = 0;
					}
					tinyMCE.triggerSave();
					
					contenidoEntrada = $("#contenido").val();
					
					$.ajax({
					  method: "POST",
					  url: "<?=updatepage?>",
					  data: { pagina_id: $("#pagina_id").val(), titulo: $("#titulo").val(), subtitulo: $("#subtitulo").val(), friendly_url: $("#friendly_url").val(), meta_description: $("#meta_description").val(), keywords: $("#tags_1").val(), estado: publicado, contenido: contenidoEntrada, principal: $("#principal").val() }
					}).done(function( msg ) {
						if(msg !== ""){
							alert(msg);
						}else{
							window.location = '<?=pageeditfile?>?page='+$("#pagina_id").val()+'&updated=1';
						}
					});
				} else {
					alert("Debes rellenar los campos obligatorios.");
				}
			});
		});	

		Dropzone.autoDiscover = false;
		$('.dropzone').dropzone ({
				url: "<?=uploadimagespagefile?>",
				init: function() {
					thisDropzone = this;
					this.on("sending", function(file, xhr, formData){
						formData.append("pageID", $("#pagina_id").val())
					});
				},
		});
		

		$(".options .remove").click(function(){
			$.ajax({
				url: "<?=deleteimagespagefile?>",
				type: "POST",
				data: { 'imageID': this.getAttribute("data-id"), 'ruta': this.getAttribute("data-file")}
			}).done(function(){
				location.reload();
			});
		});

		$(".options .add").click(function(){
			var url = this.getAttribute("data-file");
			var filename = url.substring(url.lastIndexOf('/')+1);
			$("#principal").val(filename);
		});

		$(".options .add_to_text").click(function(){
			var ed = tinyMCE.activeEditor;
			var marker = ed.dom.get('_math_marker');
			ed.selection.select(marker, false);
			var url = this.getAttribute("data-file");
			var filename = url.substring(url.lastIndexOf('/')+1);
			selectimage = "../uploads/pages/1080/" + filename;
			ed.selection.setContent("<img src='" + selectimage + "' class='img-responsive'>");
		});

		$('.dd').nestable({});

		$('.dd').on('change', function(e) {
			
			var list = e.length ? e : $(e.target);
							
			$.ajax({
				method: "POST",
				url: "<?=updatelistimagesfile?>",
				data: {
					listado: list.nestable('serialize'),
					type: 'pagesimages'
				}
			}).done(function(data){
				
			}).fail(function(jqXHR, textStatus, errorThrown){
				alert("Unable to save new list order: " + errorThrown);
			});
		});
		
	</script>
