	<script type="text/javascript">
	
	function borradoUser(id){
		var id = id;
		$.ajax({
		  method: "POST",
		  url: "<?=deluserfile?>",
		  data: { user_id: id }
		}).done(function( msg ) {
			if(msg !== ""){
				alert(msg);
			}else{
				window.location = "/catmin/users.php?deleted=1";
			}
		});
	}
	
	$(function() {
		$("#nuevoUsuario").click(function(){
			if($("#nombre").val() != ""){				
				$.ajax({
				  method: "POST",
				  url: "<?=newuserfile?>",
				  data: { nombre: $("#nombre").val() }
				}).done(function( msg ) {
					if($.isNumeric(msg)){
						window.location = "<?=usereditfileadmin?>?user=" + msg;
					}else{
						alert(msg);
					}
				});
			} else {
				alert("El campo de título no debería estar vacío.");
			}
		});
	});
	
</script>
