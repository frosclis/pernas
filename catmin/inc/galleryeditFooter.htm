	<script type="text/javascript">
	
		function addPortada(imagen, id){
			var url = imagen;
			var filename = url.substring(url.lastIndexOf('/')+1);
			$("#principal").val(filename);
			$("#portada-"+id).css("color", "red");
		}
		
		
		$(function() {
			$("#updategallery").click(function(){
				if($("#titulo").val() != "" && $("#friendly_url").val() != ""){
					if($('#estado')[0].checked == true){
						var publicado = 1;
					} else {
						var publicado = 0;
					}
					
					$.ajax({
					  method: "POST",
					  url: "<?=updategallery?>",
					  data: { gallery_id: $("#gallery_id").val(), titulo: $("#titulo").val(), subtitulo: $("#subtitulo").val(), friendly_url: $("#friendly_url").val(), meta_description: $("#meta_description").val(), keywords: $("#tags_1").val(), estado: publicado, principal: $("#principal").val(), categoria: $("#categoria").val() }
					}).done(function( msg ) {
						if(msg !== ""){
							alert(msg);
						}else{
							window.location = '<?=galleryeditfile?>?gallery='+$("#gallery_id").val()+'&updated=1';
						}
					});
				} else {
					alert("Debes rellenar los campos obligatorios.");
				}
			});
		});	
		

		Dropzone.autoDiscover = false;
		$('.dropzone').dropzone ({
				url: "<?=uploadimagesgalleryfile?>",
				init: function() {
					thisDropzone = this;
					$.ajax({
					  method: "POST",
					  url: "<?=uploadimagesgalleryfile?>",
					  data: { galleryID: $("#gallery_id").val() },
					  dataType: "json"
					}).done(function(data) {
						
						$.each(data, function(key,value){
							 
							var mockFile = { name: "../uploads/galleries/"+value.file_name, size: value.id };
							
							thisDropzone.emit("addedfile", mockFile);
							
							thisDropzone.createThumbnailFromUrl(mockFile, "../uploads/galleries/"+value.file_name);

							thisDropzone.emit("complete", mockFile);
	 	
						});
						
					});
					
					this.on("sending", function(file, xhr, formData){
						formData.append("galleryID", $("#gallery_id").val())
						this.on('queuecomplete', function () {
							location.reload();
						});
					});
					
					this.on('removedfile', function(file){
						$.ajax({
						url: "<?=deleteimagesgalleryfile?>",
						type: "POST",
						data: { 'imageID': file.size, 'ruta': file.name}
						});
					});
				},
		});
		
		window.addEventListener('load', function () {
			portada = $("#principal").val();
			portada = "../uploads/galleries/" + portada;
			var dates = document.getElementsByClassName("dz-portada");
			
			for(var i=0; i<dates.length; i++){
				var favorito = dates[i].innerHTML;
				if(favorito == portada){
					var id = dates[i].id;
					$("#"+id).css("color", "red");
					break;
				}
			}
		});
	</script>
