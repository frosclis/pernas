	<script type="text/javascript">
		$(function() {
			$("#updatecategory").click(function(){
				if($("#category_nombre").val() != "" && $("#friendly_url").val() != ""){
					if($('#estado')[0].checked == true){
						var publicado = 1;
					} else {
						var publicado = 0;
					}
					
					$.ajax({
					  method: "POST",
					  url: "<?=updatecategory?>",
					  data: { categoria_id: $("#categoria_id").val(), categoria_nombre: $("#categoria_nombre").val(), categoria_padre: $("#categoria_padre").val(), friendly_url: $("#friendly_url").val(), categoria_description: $("#categoria_description").val(), keywords: $("#tags_1").val(), estado: publicado }
					}).done(function( msg ) {
						if(msg !== ""){
							alert(msg);
						}else{
							window.location = '<?=categoryeditfile?>?category='+$("#categoria_id").val()+'&updated=1';
						}
					});
				} else {
					alert("Debes rellenar los campos obligatorios.");
				}
			});
		});	
		

		Dropzone.autoDiscover = false;
		$('.dropzone').dropzone ({
				url: "<?=uploadimagescategoryfile?>",
				init: function() {
					thisDropzone = this;
					this.on("sending", function(file, xhr, formData){
						formData.append("categoryID", $("#categoria_id").val())
					});
				},
		});

		$('.dd').nestable({});

		$('.dd').on('change', function(e) {
			
			var list = e.length ? e : $(e.target);
							
			$.ajax({
				method: "POST",
				url: "<?=updatelistimagesfile?>",
				data: {
					listado: list.nestable('serialize'),
					type: 'categoryimages'
				}
			}).done(function(data){
				
			}).fail(function(jqXHR, textStatus, errorThrown){
				alert("Unable to save new list order: " + errorThrown);
			});
		});

		$(".options .remove").click(function(){
			$.ajax({
				url: "<?=deleteimagescategoryfile?>",
				type: "POST",
				data: { 'imageID': this.getAttribute("data-id"), 'ruta': this.getAttribute("data-file")}
			}).done(function(){
				location.reload();
			});
		});

	</script>
