	<script type="text/javascript">
	
		function addImagen(selectimage){
			var ed = tinyMCE.activeEditor;
			var marker = ed.dom.get('_math_marker');
			ed.selection.select(marker, false);
			var url = selectimage;
			var filename = url.substring(url.lastIndexOf('/')+1);
			selectimage = "../uploads/posts/1080/" + filename;
			ed.selection.setContent("<img src='" + selectimage + "' class='img-responsive'>");
		}
	
		function addPortada(imagen, id){
			var url = imagen;
			var filename = url.substring(url.lastIndexOf('/')+1);
			$("#portada").val(filename);
			$("#portada-"+id).css("color", "red");
		}
	
		$(function() {
			$("#updatepost").click(function(){
				if($("#titulo").val() != "" && $("#friendly_url").val() != ""){
					if($('#estado')[0].checked == true){
						var publicado = 1;
					} else {
						var publicado = 0;
					}
					tinyMCE.triggerSave();
					
					contenidoEntrada = $("#contenido").val();
					
					$.ajax({
					  method: "POST",
					  url: "<?=updatepost?>",
					  data: { pagina_id: $("#pagina_id").val(), titulo: $("#titulo").val(), subtitulo: $("#subtitulo").val(), friendly_url: $("#friendly_url").val(), meta_description: $("#meta_description").val(), keywords: $("#tags_1").val(), estado: publicado, contenido: contenidoEntrada, portada: $("#portada").val(), fecha_publicacion: $("#fecha_publicacion").val(), categoria: $("#categoria").val() }
					}).done(function( msg ) {
						if(msg !== ""){
							alert(msg);
						}else{
							window.location = '<?=posteditfile?>?post='+$("#pagina_id").val()+'&updated=1';
						}
					});
				} else {
					alert("Debes rellenar los campos obligatorios.");
				}
			});
		});	
		

		Dropzone.autoDiscover = false;
		$('.dropzone').dropzone ({
				url: "<?=uploadimagespostfile?>",
				init: function() {
					thisDropzone = this;
					$.ajax({
					  method: "POST",
					  url: "<?=uploadimagespostfile?>",
					  data: { pageID: $("#pagina_id").val() },
					  dataType: "json"
					}).done(function(data) {
						
						$.each(data, function(key,value){
							 
							var mockFile = { name: "../uploads/posts/"+value.file_name, size: value.id };
							
							thisDropzone.emit("addedfile", mockFile);
							
							thisDropzone.createThumbnailFromUrl(mockFile, "../uploads/posts/"+value.file_name);

							thisDropzone.emit("complete", mockFile);
	 	
						});
					});
					
					this.on("sending", function(file, xhr, formData){
						formData.append("pageID", $("#pagina_id").val())
						this.on('complete', function () {
							location.reload();
						});
					});
					
					this.on('removedfile', function(file){
						$.ajax({
						url: "<?=deleteimagespostfile?>",
						type: "POST",
						data: { 'imageID': file.size, 'ruta': file.name}
						});
					});
				},
		});
		
		$(function () {
			$('#fecha_publicacion').datetimepicker();
		});
		
		window.addEventListener('load', function () {
			portada = $("#portada").val();
			portada = "../uploads/posts/" + portada;
			var dates = document.getElementsByClassName("dz-portada");
			
			for(var i=0; i<dates.length; i++){
				var favorito = dates[i].innerHTML;
				if(favorito == portada){
					var id = dates[i].id;
					$("#"+id).css("color", "red");
					break;
				}
			}
		});
	</script>
  </body>
